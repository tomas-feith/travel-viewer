name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

jobs:
  check:
    # storage.py saves through tempfile + os.replace, whose semantics differ on
    # Windows (a reader holding the target can block the rename). Windows is also
    # the platform this is developed on, so both legs earn their place.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so pin the exact release.
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run --no-sync ruff check .

      - name: Ruff format
        run: uv run --no-sync ruff format --check .

      - name: Mypy
        run: uv run --no-sync mypy

      - name: Pytest
        run: uv run --no-sync pytest
